<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa — Bimbel Pradipta</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-[#123B2A] px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
    <h2 class="text-2xl font-extrabold text-[#0B1F3A]">Login Akun Siswa</h2>
    <p class="mt-2 text-sm text-slate-500">Masukkan NISN atau Nomor Pendaftaran Anda.</p>
    
    <form class="mt-6 space-y-4" onsubmit="alert('Simulasi Login Siswa Berhasil!'); return false;">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600">Nomor Induk / NISN</label>
        <input type="text" required class="mt-1 w-full rounded-lg border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600">Password</label>
        <input type="password" required class="mt-1 w-full rounded-lg border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
      </div>
      <button type="submit" class="w-full rounded-lg bg-[#D4AF37] py-3 text-sm font-bold text-[#123B2A] transition hover:bg-[#edca55]">MASUK DASHBOARD</button>
    </form>
    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs font-semibold text-slate-500 hover:underline">← Kembali ke Beranda</a>
    </div>
  </div>
</body>
</html>
