<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Tentor — Bimbel Pradipta</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#123B2A; --gold:#D4AF37; --red:#C62828; --ink:#142641; --cream:#F8F7F2; }
    * { box-sizing:border-box; }
    body { font-family:"DM Sans",sans-serif; color:var(--ink); }
    .hero-wash { background:linear-gradient(135deg,#08261d 0%,#123B2A 48%,#1d5a40 100%); }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center hero-wash px-4 py-12">
  
  <div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl md:p-10">
    <!-- Header Form -->
    <div class="text-center">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-[#123B2A] text-[#D4AF37] shadow-md">
        <i data-lucide="shield-check" class="h-6 w-6"></i>
      </div>
      <h2 class="mt-4 text-2xl font-extrabold text-[#0B1F3A]">Portal Tentor</h2>
      <p class="mt-1 text-xs font-bold uppercase tracking-wider text-[#C62828]">Bimbel Pradipta</p>
      <p class="mt-2 text-sm text-slate-500">Silakan masukkan ID Pengajar dan kata sandi Anda untuk mengakses dashboard pengajaran.</p>
    </div>

    <!-- Form Login -->
    <form class="mt-8 space-y-5" onsubmit="alert('Simulasi Login Tentor Berhasil!'); return false;">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">ID Pengajar / Email</label>
        <div class="relative mt-1">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i data-lucide="user" class="h-4 w-4"></i>
          </span>
          <input type="text" required placeholder="Contoh: TENTOR01" class="w-full rounded-xl border border-slate-300 py-3 pl-10 pr-4 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Kata Sandi</label>
        <div class="relative mt-1">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i data-lucide="lock" class="h-4 w-4"></i>
          </span>
          <input type="password" required placeholder="••••••••" class="w-full rounded-xl border border-slate-300 py-3 pl-10 pr-4 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 cursor-pointer text-slate-600">
          <input type="checkbox" class="rounded border-slate-300 text-[#123B2A] focus:ring-[#123B2A]"> Ingat saya
        </label>
        <a href="#" class="font-semibold text-[#123B2A] hover:underline">Lupa sandi?</a>
      </div>

      <button type="submit" class="w-full rounded-xl bg-[#D4AF37] py-3.5 text-sm font-extrabold text-[#123B2A] transition hover:bg-[#edca55] shadow-lg">
        MASUK DASHBOARD TENTOR
      </button>
    </form>

    <!-- Footer Navigasi -->
    <div class="mt-8 border-t border-slate-100 pt-6 text-center">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-[#123B2A] transition">
        <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> Kembali ke Beranda Utama
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
