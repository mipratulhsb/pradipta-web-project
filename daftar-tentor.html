<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Akun Tentor — Bimbel Pradipta</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Library Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#123B2A; --gold:#D4AF37; --red:#C62828; --ink:#142641; }
    body { font-family:"DM Sans",sans-serif; color:var(--ink); background:#F8F7F2; }
    .hero-wash { background:linear-gradient(135deg,#08261d 0%,#123B2A 48%,#1d5a40 100%); }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4 py-12">
  <div class="w-full max-w-xl rounded-3xl bg-white p-8 shadow-2xl md:p-10">
    <div class="text-center">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-[#123B2A] text-[#D4AF37]">
        <i data-lucide="user-plus" class="h-6 w-6"></i>
      </div>
      <h2 class="mt-4 text-2xl font-extrabold text-[#0B1F3A]">Formulir Pendaftaran Tentor</h2>
      <p class="mt-1 text-xs font-bold uppercase tracking-wider text-[#C62828]">Bimbel Pradipta</p>
      <p class="mt-2 text-sm text-slate-500">Lengkapi data diri Anda untuk langsung terdaftar di sistem database.</p>
    </div>

    <form id="form-daftar-tentor" class="mt-8 space-y-4">
      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Nama Lengkap & Gelar</label>
          <input type="text" id="nama" required placeholder="Contoh: Bripda Mipratul, S.H." class="mt-1 w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Mata Pelajaran / Bidang</label>
          <input type="text" id="mapel" required placeholder="Contoh: TWK / Tes Jasmani" class="mt-1 w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Alamat Email</label>
          <input type="email" id="email" required placeholder="email@domain.com" class="mt-1 w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Nomor WhatsApp</label>
          <input type="tel" id="whatsapp" required placeholder="08xxxxxxxxxx" class="mt-1 w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">URL Foto Profil (Opsional/Link Gambar)</label>
        <input type="text" id="foto_url" placeholder="https://..." class="mt-1 w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-[#123B2A] focus:outline-none">
      </div>

      <button type="submit" id="btn-submit" class="w-full rounded-xl bg-[#D4AF37] py-3.5 text-sm font-extrabold text-[#123B2A] transition hover:bg-[#edca55] shadow-lg mt-4">
        DAFTARKAN AKUN TENTOR
      </button>
    </form>

    <div class="mt-6 border-t border-slate-100 pt-4 text-center">
      <a href="login-tentor.html" class="text-xs font-bold text-slate-500 hover:text-[#123B2A]">← Kembali ke Halaman Login</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

    // Konfigurasi Supabase Anda
    const SUPABASE_URL = 'https://cfxphpdgsiepvlejlnje.supabase.co';
    const SUPABASE_ANON_KEY = 'MASUKKAN_PUBLISHABLE_KEY_ANDA_DISINI';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('form-daftar-tentor').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.textContent = "Menyimpan ke Database...";
      btn.disabled = true;

      const nama_lengkap = document.getElementById('nama').value;
      const mapel = document.getElementById('mapel').value;
      const email = document.getElementById('email').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const foto_url = document.getElementById('foto_url').value || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb';

      // Masukkan data ke tabel 'tentors' di Supabase
      const { error } = await supabaseClient
        .from('tentors')
        .insert([{ nama_lengkap, mapel, email, whatsapp, foto_url }]);

      if (error) {
        alert('Gagal mendaftar: ' + error.message);
        btn.textContent = "DAFTARKAN AKUN TENTOR";
        btn.disabled = false;
      } else {
        alert('Pendaftaran Berhasil! Data Anda telah tersimpan di database.');
        window.location.href = 'dashboard-tentor.html';
      }
    });
  </script>
</body>
</html>
