<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tentor — Bimbel Pradipta</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Supabase & HTML2PDF Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "DM Sans", sans-serif; background: #F8F7F2; }
    input { font-variant-numeric: tabular-nums; }
    textarea { resize: vertical; min-height: 38px; line-height: 1.4; }
    .editable-header { background: rgba(255, 255, 255, 0.1); border: 1px dashed rgba(255, 255, 255, 0.4); border-radius: 6px; padding: 2px 6px; color: white; font-weight: bold; text-align: center; }
    .editable-header:focus { background: white; color: #123B2A; outline: none; }
  </style>
</head>
<body class="min-h-screen text-[#142641]">

  <!-- Topbar -->
  <header class="bg-[#123B2A] text-white px-6 py-4 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-[#D4AF37] text-[#123B2A] p-2 rounded-xl font-extrabold text-xs">PRADIPTA</div>
      <h1 class="font-extrabold text-base md:text-lg">PANEL AKADEMIK TENTOR (DATABASE LIVE)</h1>
    </div>
    <a href="index.html" class="text-xs font-bold bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 transition">Keluar</a>
  </header>

  <main class="max-w-7xl mx-auto p-5 md:p-8 space-y-8">

    <!-- BAGIAN 1: INPUT SISWA BARU & TAMBAH KOLOM BARU -->
    <div class="grid gap-6 md:grid-cols-2">
      <!-- Tambah Siswa -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <h2 class="text-base font-extrabold text-[#0B1F3A] flex items-center gap-2">
          <i data-lucide="user-plus" class="text-[#D4AF37] h-5 w-5"></i> Tambah Data Siswa Baru
        </h2>
        <form id="form-tambah-siswa" class="mt-4 space-y-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600">Nama Kelas</label>
            <input type="text" id="input-kelas" value="Kelas Intensif AKPOL / Bintara" required class="mt-1 w-full rounded-xl border border-slate-300 p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600">Nama Lengkap Siswa</label>
            <input type="text" id="input-nama-siswa" placeholder="Contoh: Ahmad Fauzan" required class="mt-1 w-full rounded-xl border border-slate-300 p-2.5 text-sm">
          </div>
          <button type="submit" class="w-full bg-[#123B2A] text-white px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-[#1d5a40] transition">Simpan Siswa ke Database</button>
        </form>
      </section>

      <!-- Tambah Kolom Kustom Baru -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <h2 class="text-base font-extrabold text-[#0B1F3A] flex items-center gap-2">
          <i data-lucide="columns" class="text-[#D4AF37] h-5 w-5"></i> Tambah Kolom Evaluasi/Ujian Baru
        </h2>
        <form id="form-tambah-kolom" class="mt-4 space-y-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600">Nama Kolom / Ujian Baru</label>
            <input type="text" id="input-nama-kolom" placeholder="Contoh: Psikotes / Kesemaptaan" required class="mt-1 w-full rounded-xl border border-slate-300 p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600">Tipe Data Kolom</label>
            <select id="input-tipe-kolom" class="mt-1 w-full rounded-xl border border-slate-300 p-2.5 text-sm bg-white">
              <option value="numeric">Angka / Nilai (Numeric)</option>
              <option value="text">Teks / Catatan (Text)</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-[#D4AF37] text-[#123B2A] px-4 py-2.5 rounded-xl text-xs font-extrabold hover:bg-[#edca55] transition">Tambahkan ke Tabel</button>
        </form>
      </section>
    </div>

    <!-- BAGIAN 2: TABEL NILAI & LAPORAN PDF -->
    <section id="area-laporan" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-xl font-extrabold text-[#0B1F3A]">Rekapitulasi Nilai & Evaluasi Siswa</h2>
          <p class="text-xs text-slate-500 mt-1">Klik langsung pada judul kolom tabel di bawah untuk mengubah nama ujian/kategori.</p>
        </div>
        <button onclick="unduhPDF()" class="inline-flex items-center gap-2 bg-[#C62828] text-white px-5 py-2.5 rounded-xl text-xs font-extrabold shadow-md hover:bg-red-700 transition">
          <i data-lucide="download" class="h-4 w-4"></i> Unduh Laporan PDF
        </button>
      </div>

      <!-- Tabel Data -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="tabel-header-tr" class="bg-[#123B2A] text-white uppercase tracking-wider">
              <th class="p-3 rounded-l-xl">Nama Siswa</th>
              <th class="p-3">Kelas</th>
              <th class="p-3 text-center"><input type="text" value="Pre-Test" class="editable-header w-20 text-center" onchange="updateLabelKolom('pre_test', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Latihan" class="editable-header w-20 text-center" onchange="updateLabelKolom('latihan', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Mid-Test" class="editable-header w-20 text-center" onchange="updateLabelKolom('mid_test', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Try Out 1" class="editable-header w-24 text-center" onchange="updateLabelKolom('try_out_1', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Try Out 2" class="editable-header w-24 text-center" onchange="updateLabelKolom('try_out_2', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Try Out 3" class="editable-header w-24 text-center" onchange="updateLabelKolom('try_out_3', this.value)"></th>
              <th class="p-3 text-center"><input type="text" value="Post-Test" class="editable-header w-20 text-center" onchange="updateLabelKolom('post_test', this.value)"></th>
              <th class="p-3 rounded-r-xl">Evaluasi Mingguan</th>
            </tr>
          </thead>
          <tbody id="tabel-nilai-body" class="divide-y divide-slate-100 font-medium">
            <tr><td colspan="10" class="p-4 text-center text-slate-400">Memuat data dari database...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      muatDataSiswa();
    });

    const SUPABASE_URL = 'https://cfxphpdgsiepvlejlnje.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lPfuVkeL8Eo5K8663gcrfQ_4J-o-7aD';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Simpan label judul kolom di localStorage browser agar tetap tersimpan
    function updateLabelKolomjam(kolom, labelBaru) {
      localStorage.setItem('label_' + kolom, labelBaru);
    }

    async function muatDataSiswa() {
      const tbody = document.getElementById("tabel-nilai-body");
      const { data, error } = await supabaseClient.from('siswas').select('*');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-red-500">Gagal memuat data: ${error.message}</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-slate-400">Belum ada data siswa di database. Silakan tambah melalui form di atas.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      data.forEach((siswa) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="p-3 font-bold text-[#0B1F3A]">${siswa.nama_siswa}</td>
          <td class="p-3 text-slate-600">${siswa.nama_kelas}</td>
          <td class="p-3 text-center"><input type="number" value="${siswa.pre_test || 0}" onchange="updateNilai('${siswa.id}', 'pre_test', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.latihan || 0}" onchange="updateNilai('${siswa.id}', 'latihan', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.mid_test || 0}" onchange="updateNilai('${siswa.id}', 'mid_test', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.try_out_1 || 0}" onchange="updateNilai('${siswa.id}', 'try_out_1', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.try_out_2 || 0}" onchange="updateNilai('${siswa.id}', 'try_out_2', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.try_out_3 || 0}" onchange="updateNilai('${siswa.id}', 'try_out_3', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3 text-center"><input type="number" value="${siswa.post_test || 0}" onchange="updateNilai('${siswa.id}', 'post_test', this.value)" class="w-16 text-center border rounded p-1"></td>
          <td class="p-3">
            <textarea oninput="autoResize(this)" onchange="updateNilai('${siswa.id}', 'evaluasi_mingguan', this.value)" class="w-full border rounded p-2 text-xs bg-slate-50 focus:bg-white transition" placeholder="Tulis catatan evaluasi mingguan di sini...">${siswa.evaluasi_mingguan || ''}</textarea>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Sesuaikan ukuran tinggi textarea setelah data dimuat
      document.querySelectorAll('textarea').forEach(el => autoResize(el));
    }

    // Fungsi agar textarea otomatis membesar menyesuaikan teks
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    // Tambah Siswa Baru
    document.getElementById('form-tambah-siswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama_siswa = document.getElementById('input-nama-siswa').value;
      const nama_kelas = document.getElementById('input-kelas').value;

      const { error } = await supabaseClient.from('siswas').insert([{ nama_siswa, nama_kelas }]);
      if (error) {
        alert('Gagal menambah siswa: ' + error.message);
      } else {
        document.getElementById('input-nama-siswa').value = "";
        muatDataSiswa();
      }
    });

    // Fitur Tambah Kolom Baru (Simulasi interaktif tabel web)
    document.getElementById('form-tambah-kolom').addEventListener('submit', (e) => {
      e.preventDefault();
      const namaKolom = document.getElementById('input-nama-kolom').value;
      const headerTr = document.getElementById('tabel-header-tr');
      
      // Buat elemen header th baru sebelum kolom evaluasi
      const newTh = document.createElement('th');
      newTh.className = "p-3 text-center";
      newTh.innerHTML = `<input type="text" value="${namaKolom}" class="editable-header w-24 text-center">`;
      headerTr.insertBefore(newTh, headerTr.lastElementChild);

      // Tambahkan sel input baru ke setiap baris data di tabel
      const rows = document.querySelectorAll('#tabel-nilai-body tr');
      rows.forEach(row => {
        const newTd = document.createElement('td');
        newTd.className = "p-3 text-center";
        newTd.innerHTML = `<input type="text" value="0" class="w-16 text-center border rounded p-1">`;
        row.insertBefore(newTd, row.lastElementChild);
      });

      alert(`Kolom "${namaKolom}" berhasil ditambahkan ke tabel laporan!`);
      document.getElementById('input-nama-kolom').value = "";
    });

    // Update Nilai ke Supabase
    async function updateNilai(id, kolom, nilaiBaru) {
      const payload = {};
      payload[kolom] = kolom === 'evaluasi_mingguan' ? nilaiBaru : Number(nilaiBaru);

      const { error } = await supabaseClient.from('siswas').update(payload).eq('id', id);
      if (error) console.error("Gagal menyimpan nilai:", error);
    }

    // Cetak ke PDF
    function unduhPDF() {
      const element = document.getElementById("area-laporan");
      const opt = {
        margin: 0.5,
        filename: 'Laporan-Perkembangan-Siswa-Pradipta.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
      };
      html2pdf().from(element).set(opt).save();
    }
  </script>
</body>
</html>
